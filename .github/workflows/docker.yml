name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication for each ref.
concurrency:
  group: earwitness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.image-name.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve image repository
        id: image-name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: earwitness:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image-name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long
            type=ref,event=tag
      - name: Publish tested image
        id: publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test web and worker without external services
        env:
          SMOKE_IMAGE: ${{ steps.publish.outputs.digest && format('{0}@{1}', steps.image-name.outputs.image, steps.publish.outputs.digest) || 'earwitness:smoke' }}
        run: |
          set -euo pipefail
          docker run -d --name earwitness-smoke -p 127.0.0.1:8000:8000 \
            -e SERVICE=web -e AUTOSYNC_INTERVAL=0 "$SMOKE_IMAGE"
          trap 'docker logs earwitness-smoke; docker rm -f earwitness-smoke' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz | jq -e '.ok == true'; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          # Exercise worker startup and database initialization on an empty DB.
          docker run --rm --entrypoint python -e AUTOSYNC_INTERVAL=0 \
            "$SMOKE_IMAGE" -m webapp.worker --once

  image-status:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - name: Record the tested image digest
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f context=container-image \
            -f description="$DIGEST" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
